name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p mine-utils-core --all-targets -- -D warnings
      # MINE_UTILS_REAL_OPTIONS stays unset so the real-file roundtrip test skips.
      # Core tests run here without the webkit deps; the Tauri crate's own tests
      # run in the tauri job, which already installs them.
      - run: cargo test -p mine-utils-core

  tauri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libxdo-dev
          libssl-dev
          patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p mine-utils
      - run: pnpm tauri build --no-bundle
