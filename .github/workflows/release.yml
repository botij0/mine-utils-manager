name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libxdo-dev
          libssl-dev
          patchelf
          rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Collect artifacts
        run: |
          set -eu
          ls -la src-tauri/target/release/bundle/appimage src-tauri/target/release/bundle/rpm
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-release/
          (cd dist-release && sha256sum ./* > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mine-utils-${{ github.ref_name }}-linux
          path: dist-release/
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
