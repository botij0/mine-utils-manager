name: release

on:
  push:
    tags: ['v*']
  # Manual dry run: builds and uploads the collect step as a workflow
  # artifact without publishing a GitHub release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libxdo-dev
          libssl-dev
          patchelf
          rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Collect artifacts
        run: |
          set -eu
          # The workspace writes target/release/bundle/..., not
          # src-tauri/target/release/bundle/...: collect from the real path.
          ls -la target/release/bundle/appimage target/release/bundle/rpm
          appimage="$(ls target/release/bundle/appimage/*.AppImage)"
          rpm_pkg="$(ls target/release/bundle/rpm/*.rpm)"
          test -f "$appimage" || { echo "no AppImage found"; exit 1; }
          test -f "$rpm_pkg" || { echo "no RPM found"; exit 1; }
          mkdir -p dist-release
          # Stable, shell-friendly names. On a tag push the version is the
          # tag without the leading `v`; on a manual dispatch the ref name
          # is sanitized so the dry run never publishes tag names.
          raw_version="${GITHUB_REF_NAME#v}"
          version="$(printf '%s' "$raw_version" | tr -c 'A-Za-z0-9._-' '_')"
          cp "$appimage" "dist-release/mine-utils_${version}_amd64.AppImage"
          cp "$rpm_pkg" "dist-release/mine-utils-${version}-1.x86_64.rpm"
          (cd dist-release && sha256sum ./* > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mine-utils-${{ github.ref_name }}-linux
          path: dist-release/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
